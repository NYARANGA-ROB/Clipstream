name: Build and deploy Node.js app to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: clipstream-api-2026
  AZURE_WEBAPP_PACKAGE_PATH: chhavi-anvaya-backend
  NODE_VERSION: "22.x"
  API_PUBLIC_URL: https://clipstream-api-2026-hgfrfpd6cbcpc8bh.germanywestcentral-01.azurewebsites.net

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install and build frontend
        working-directory: chhavi-anvaya-frontend
        env:
          CI: "false"
          REACT_APP_API_URL: /api/
          REACT_APP_API_URL_IMAGES: ${{ env.API_PUBLIC_URL }}/
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
          npm run build

      - name: Copy frontend build into API
        run: |
          rm -rf chhavi-anvaya-backend/public
          mkdir -p chhavi-anvaya-backend/public
          cp -r chhavi-anvaya-frontend/build/* chhavi-anvaya-backend/public/

      - name: Install API dependencies
        working-directory: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci --omit=dev
          else
            npm install --omit=dev
          fi

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
