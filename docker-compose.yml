services:
  postgres:
    image: postgres:16
    container_name: clipstream_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: chhavi_anvaya
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: clipstream_redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]

  minio:
    image: minio/minio:latest
    container_name: clipstream_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 4;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/clipstream || true;
      exit 0;
      "

  api:
    build:
      context: ./chhavi-anvaya-backend
    container_name: clipstream_api
    env_file:
      - ./chhavi-anvaya-backend/.env
    environment:
      PG_HOST: postgres
      PG_URI: postgres://postgres:password@postgres:5432/chhavi_anvaya
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      CLIENT_URL: http://localhost
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    ports:
      - "8000:8000"

  web:
    build:
      context: ./chhavi-anvaya-frontend
      args:
        REACT_APP_API_URL: /api/
        REACT_APP_API_URL_IMAGES: /
    container_name: clipstream_web
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  postgres_data:
  minio_data:
